[package]
name = "task-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
description = "Task API: a small REST service for managing tasks (axum + sqlx + PostgreSQL)"

[lib]
name = "task_api"
path = "src/lib.rs"

[[bin]]
name = "task-api"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
axum = "0.8.9"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
dotenvy = "0.15"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sqlx = { version = "0.9.1", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "uuid",
    "chrono",
    "migrate",
    "macros",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync"] }
tower-http = { version = "0.6", features = ["catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "std", "json", "env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
futures-util = "0.3"
nix = { version = "0.30", features = ["signal"] }
reqwest = { version = "0.12", default-features = false }
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
